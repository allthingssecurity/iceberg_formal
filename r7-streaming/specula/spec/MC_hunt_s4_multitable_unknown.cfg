\* MC_hunt_s4_multitable_unknown.cfg
\* MC-4 / Q4: two tables, one commit lands while the other fails or has an unknown outcome
\* (landed or not), retry in-process (budget 2) and replay after the task failure.  No
\* snapshot maintenance (keeps the KNOWN-to-fail F3 path out).  Predicted safe.
\* Target: NoDuplicateRows, FloorSound, NoStrandedDataWritten (+ CheckpointSound, core).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 1
    Tables            = {T1, T2}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 2
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 1
    MaxRebalances     = 0
    MaxLost           = 0
    MaxCrashes        = 1
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 2
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDuplicateRows
    FloorSound
    NoStrandedDataWritten
    CheckpointSound
    AtMostOneCommitPerDataWritten
    SourceCommittedCovered
