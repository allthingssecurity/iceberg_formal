\* MC_hunt_s1_onevariant.cfg
\* Scenario 1 / MC-1(b): one TableReference variant; other paths that could leave a
\* T-envelope below the committing coordinator position outside the commit: retained buffer
\* after Iceberg CommitFailed (budget 2), -coord partition bounce, late DataWritten (timeout),
\* checkpoint failure, crash/restart.
\* Target: FloorSound, NoStrandedDataWritten, CheckpointSound (+ core safety).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 3
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 2
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 1
    MaxRebalances     = 0
    MaxLost           = 0
    MaxCrashes        = 1
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 1
    MaxCkptFaults     = 1
    MaxCgRebalances   = 1
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

SYMMETRY Symmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    FloorSound
    NoStrandedDataWritten
    CheckpointSound
    SourceCommittedCovered
    NoDuplicateRows
