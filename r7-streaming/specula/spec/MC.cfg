\* MC.cfg -- spec validation (convergence) configuration.
\* Standard exactly-once safety + structural invariants.  Scenario (extension)
\* invariants are listed but commented out; they are enabled in MC_hunt_*.cfg.
\* Known issues are switched off: FixNullSeek (#18767), CoordReset "earliest"
\* (#18006), no control-topic recreation (#15293), one TableReference variant.
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 3
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 1
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds
    MaxCommits      = 2
    MaxTimeouts     = 1
    MaxRebalances   = 1
    MaxLost         = 1
    MaxCrashes      = 1
    MaxRestarts     = 1
    MaxPauseResume  = 0
    MaxCloseFaults  = 0
    MaxCasFaults    = 1
    MaxCkptFaults   = 0
    MaxCgRebalances = 0
    MaxOtherWrites  = 0
    MaxExpires      = 0
    MaxBranchDrops  = 0
    MaxOffsetLoss   = 0
    MaxRecreate     = 0
    MaxCtlLen       = 12

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

\* ============================================================================
\* Standard exactly-once safety (brief §5)
\* ============================================================================
INVARIANTS
    NoDuplicateRows
    AtMostOneCommitPerDataWritten
    SourceCommittedCovered

\* ============================================================================
\* Structural invariants
\* ============================================================================
INVARIANTS
    TypeOK
    AtMostOneUnfencedCoordinator
    CoordOwnerIsMember
    CoordRefConsistent
    WorkerBufferAssigned
    NonLostBufferAboveCommitted

\* ============================================================================
\* Scenario (extension) invariants -- enabled in MC_hunt_*.cfg
\* ============================================================================
\* INVARIANTS
\*     FloorSound                \* S1, Q3
\*     CheckpointSound           \* S1, S4, Q5
\*     NoStrandedDataWritten     \* S1, S2, Q5
\*     ValidThroughSound         \* S5
\*     FloorReadValidatorAgree   \* S2 / F4 diagnostic (MC-5)

\* ============================================================================
\* Temporal properties
\* ============================================================================
PROPERTIES
    FloorMonotone
