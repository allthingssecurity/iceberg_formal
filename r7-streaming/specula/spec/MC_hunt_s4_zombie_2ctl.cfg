\* MC_hunt_s4_zombie_2ctl.cfg
\* Scenario 4 / MC-4 with 2 control partitions: control partitions split between a zombie
\* and its successor (R9), never-seen partitions not checkpointed (C-9).
\* Target: NoDuplicateRows, FloorSound, NoStrandedDataWritten (+ CheckpointSound, core).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0, 1}
    MaxCoord          = 3
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 2
    MaxTimeouts       = 1
    MaxRebalances     = 1
    MaxLost           = 1
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 1
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

SYMMETRY Symmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDuplicateRows
    FloorSound
    NoStrandedDataWritten
    CheckpointSound
    AtMostOneCommitPerDataWritten
    SourceCommittedCovered
