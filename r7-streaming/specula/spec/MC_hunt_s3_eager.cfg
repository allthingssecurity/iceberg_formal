\* MC_hunt_s3_eager.cfg
\* Scenario 3 / MC-3 / F2 (eager): the batch returned by the poll that rethrows the stored
\* WakeupException is dropped after positions advanced.
\* Target: SourceCommittedCovered (+ NoDuplicateRows).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 2
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "eager"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 1
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 2
    MaxTimeouts       = 1
    MaxRebalances     = 1
    MaxLost           = 0
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 1
    MaxCloseFaults    = 1
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    SourceCommittedCovered
    NoDuplicateRows
