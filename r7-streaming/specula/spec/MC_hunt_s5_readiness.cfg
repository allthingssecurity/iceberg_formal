\* MC_hunt_s5_readiness.cfg
\* Scenario 5: completion accounting -- DataComplete counts not deduplicated per partition,
\* total frozen at construction, incremental move during a commit, timeouts / late answers.
\* StaleViews lets the frozen total come from a cooperative round-1 view (#18322).
\* Target: ValidThroughSound (secondary; F11 family is KNOWN) + FloorSound, NoDuplicateRows.
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = TRUE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 2
    MaxRebalances     = 1
    MaxLost           = 0
    MaxCrashes        = 0
    MaxRestarts       = 0
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

SYMMETRY Symmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    ValidThroughSound
    FloorSound
    NoDuplicateRows
