\* MC_hunt_s2_multitable.cfg
\* Scenario 2 / MC-2 (multi-table partial success, max-consecutive-failures 1) merged with
\* Q4 / MC-4 "two tables with unknown outcomes": one table commits, the other fails or has
\* an unknown outcome; replay after the task failure, with and without floor expiry.
\* Target: NoDuplicateRows, AtMostOneCommitPerDataWritten, FloorSound, CheckpointSound.
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 1
    Tables            = {T1, T2}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 2
    MaxTimeouts       = 1
    MaxRebalances     = 0
    MaxLost           = 0
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 2
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 1
    MaxExpires        = 1
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDuplicateRows
    AtMostOneCommitPerDataWritten
    FloorSound
    CheckpointSound
    NoStrandedDataWritten

PROPERTIES
    FloorMonotone
