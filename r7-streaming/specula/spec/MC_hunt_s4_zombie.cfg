\* MC_hunt_s4_zombie.cfg
\* Scenario 4 (+ S5 timeouts) / MC-4: zombie coordinators keep consuming and committing
\* tables after the successor initTransactions (#17637 close-time describe, lost member,
\* task FAILED without join); -coord partition moves; partial commits swallow fencing and
\* validation errors; unknown table-commit outcome; timeout with late DataWritten.
\* Predicted safe: any violation is a new bug.
\* Target: NoDuplicateRows, FloorSound, NoStrandedDataWritten (+ CheckpointSound, core).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 3
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 1
    MaxRebalances     = 2
    MaxLost           = 1
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 1
    MaxCkptFaults     = 0
    MaxCgRebalances   = 1
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

SYMMETRY Symmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDuplicateRows
    FloorSound
    NoStrandedDataWritten
    CheckpointSound
    AtMostOneCommitPerDataWritten
    SourceCommittedCovered
