\* Trace validation configuration.  Constants mirror the harness topology
\* (instrumentation-spec.md §3) and the implementation defaults at 9fffeb6:
\* auto.offset.reset=latest for the -coord consumer, no null-offset seek fix,
\* describe may observe a non-Stable group, parallel table commits
\* (commit.threads = cores*2), max-consecutive-failures = 1, no commit branch.
SPECIFICATION TraceSpec

CONSTANTS
    Tasks             = {"t1", "t2"}
    NoTask            = "no-task"
    SrcParts          = {0, 1}
    NumRecs           = 64
    Tables            = {"T1"}
    NoTable           = "no-table"
    CtlParts          = {0}
    MaxCoord          = 6
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "latest"
    FixNullSeek       = FALSE
    StaleViews        = TRUE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

VIEW TraceView

ALIAS TraceAlias

\* Trace completion: the cursor must pass the last event.
PROPERTIES
    TraceMatched

CHECK_DEADLOCK FALSE

\* Invariants that must hold on every real execution (no fault injection).
INVARIANTS
    TypeOK
    AtMostOneUnfencedCoordinator
    CoordOwnerIsMember
    CoordRefConsistent
    WorkerBufferAssigned
    NonLostBufferAboveCommitted
    NoDuplicateRows
    AtMostOneCommitPerDataWritten

\* Scenario invariants can be violated by the KNOWN defaults above (#18006
\* latest reset, #18767 null-offset seek); enable for targeted trace runs.
\* INVARIANTS
\*     SourceCommittedCovered
\*     FloorSound
\*     CheckpointSound
