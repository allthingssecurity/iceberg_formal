\* MC_hunt_s1_refsplit.cfg
\* Scenario 1 / MC-1(a) / F1: one table under two TableReference groups
\* (rolling upgrade: t1 runs <=1.10 worker code, uuid == null; t2 runs >=1.11).
\* CommitThreads = 2 (default cores*2) admits both parallel and sequential group orders;
\* one restart lets the replay after the parallel-case task failure run.
\* Target: FloorSound, NoStrandedDataWritten, CheckpointSound; end-to-end SourceCommittedCovered.
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"legacy", "v"}
    LegacyTasks       = {t1}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 2
    MaxTimeouts       = 1
    MaxRebalances     = 0
    MaxLost           = 0
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    FloorSound
    NoStrandedDataWritten
    CheckpointSound
    SourceCommittedCovered
    NoDuplicateRows
