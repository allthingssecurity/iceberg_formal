\* MC_hunt_s4_stall.cfg
\* MC-5 (S4) safety encoding of the F8/F9 stall: NoCoordinatorStall flags a quiescent state
\* with pending DataWritten and no coordinator able to commit, no pending election and no
\* reactive rebalance.  StaleViews (F9), churn rebalances, lost member, crash, fenced clear (F8).
\* Target: NoCoordinatorStall (+ NoDuplicateRows).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 3
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = TRUE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 2
    MaxTimeouts       = 1
    MaxRebalances     = 2
    MaxLost           = 1
    MaxCrashes        = 1
    MaxRestarts       = 0
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

SYMMETRY Symmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoCoordinatorStall
    NoDuplicateRows
