\* MC_hunt_s2_floor_reachability_latest.cfg (confirmation variant of MC_hunt_s2_floor_reachability.cfg)
\* F3 at the 9fffeb6 default CoordReset = "latest": the replay after a crash between the table
\* commit and the -coord checkpoint starts at the PREVIOUS checkpoint, so a dup needs a prior
\* checkpointed commit cycle.  MaxOffsetLoss = 0 keeps the KNOWN #18006 latest-skip out.
\* Scenario 2 / MC-2 / F3: the dedup floor is only reachable through connector snapshots.
\* Other writer + snapshot expiry, combined with the replay windows: crash between table
\* commit and -coord checkpoint, checkpoint failure, -coord offsets lost with
\* CoordReset = "earliest" (PR #18006).
\* Target: NoDuplicateRows, AtMostOneCommitPerDataWritten, FloorMonotone.
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 2
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "latest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 1
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 1
    MaxRebalances     = 0
    MaxLost           = 0
    MaxCrashes        = 1
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 1
    MaxCgRebalances   = 0
    MaxOtherWrites    = 1
    MaxExpires        = 2
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDuplicateRows
    AtMostOneCommitPerDataWritten

PROPERTIES
