\* Smoke configuration for the (unbounded) base spec.  Use MC.cfg / MC_hunt_*.cfg
\* for model checking; this file only exercises Spec under BaseConstraint.
SPECIFICATION Spec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 1
    MaxConsecFailures = 1
    UseBranch         = FALSE

CONSTRAINT BaseConstraint

CHECK_DEADLOCK FALSE

\* Type / structural invariants only: with every fault and environment action
\* unbounded, the known issues (#15293 recreation, #18006 offset loss, F2, F3)
\* are reachable here; the safety invariants are checked by MC_hunt_*.cfg.
INVARIANTS
    TypeOK
    AtMostOneUnfencedCoordinator
    CoordOwnerIsMember
    CoordRefConsistent
    WorkerBufferAssigned
    NonLostBufferAboveCommitted

\* Safety invariants (enable to explore the unbounded base spec):
\* INVARIANTS
\*     NoDuplicateRows
\*     AtMostOneCommitPerDataWritten
\*     SourceCommittedCovered
\*     FloorSound
\*     CheckpointSound
\*     NoStrandedDataWritten
\*     ValidThroughSound

PROPERTIES
    FloorMonotone
