\* MC_hunt_s2_branch.cfg
\* Scenario 2 / F4 (safety side): commit branch configured; WAP fast-forward of main and
\* branch drop.  FloorReadValidatorAgree is EXPECTED to be violated (F4 witness: read floor {}
\* vs validator floor from main); NoDuplicateRows must still hold (validator rejects).
\* Target: FloorReadValidatorAgree (witness), NoDuplicateRows, AtMostOneCommitPerDataWritten.
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 2
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 1
    MaxConsecFailures = 1
    UseBranch         = TRUE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 1
    MaxRebalances     = 0
    MaxLost           = 0
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 1
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDuplicateRows
    AtMostOneCommitPerDataWritten
    FloorReadValidatorAgree

PROPERTIES
    FloorMonotone
