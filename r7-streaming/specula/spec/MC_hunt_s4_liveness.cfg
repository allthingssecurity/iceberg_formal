\* MC_hunt_s4_liveness.cfg
\* MC-5 (S4): can a visible DataWritten stay uncommitted forever with time budget left?
\* Minimal F9 setup: cooperative move of the first partition with a non-Stable describe at
\* open() (StaleViews), then the old coordinator host crashes; the rebalance that follows
\* adds nothing to the new owner, so open() never re-elects.  Liveness: no SYMMETRY / VIEW.
\* Target: EventuallyCommitted (companion safety encoding: MC_hunt_s4_stall.cfg).
SPECIFICATION MCLiveSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0}
    NumRecs           = 1
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = TRUE
    CommitThreads     = 1
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 3
    MaxTimeouts       = 1
    MaxRebalances     = 1
    MaxLost           = 0
    MaxCrashes        = 1
    MaxRestarts       = 0
    MaxPauseResume    = 0
    MaxCloseFaults    = 0
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

PROPERTIES
    EventuallyCommitted
