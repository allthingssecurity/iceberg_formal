\* MC_hunt_s3_close_discard.cfg
\* Scenario 3 / MC-3 / F2 (cooperative): close() discards every buffer, then the fallible
\* rewind; pause/resume wakeup during close(); fatal exceptions at every close/open step;
\* lost member.  Known null-offset seek excluded (FixNullSeek = TRUE).
\* Target: SourceCommittedCovered (+ NoDuplicateRows).
SPECIFICATION MCSpec

CONSTANTS
    Tasks             = {t1, t2}
    NoTask            = NoTask
    SrcParts          = {0, 1}
    NumRecs           = 2
    Tables            = {T1}
    NoTable           = NoTable
    CtlParts          = {0}
    MaxCoord          = 2
    RefVariants       = {"v"}
    LegacyTasks       = {}
    Protocol          = "cooperative"
    CoordReset        = "earliest"
    FixNullSeek       = TRUE
    StaleViews        = FALSE
    CommitThreads     = 2
    MaxConsecFailures = 1
    UseBranch         = FALSE

    \* MC bounds (0 = action disabled)
    MaxCommits        = 2
    MaxTimeouts       = 1
    MaxRebalances     = 1
    MaxLost           = 1
    MaxCrashes        = 0
    MaxRestarts       = 1
    MaxPauseResume    = 1
    MaxCloseFaults    = 1
    MaxCasFaults      = 0
    MaxCkptFaults     = 0
    MaxCgRebalances   = 0
    MaxOtherWrites    = 0
    MaxExpires        = 0
    MaxBranchDrops    = 0
    MaxOffsetLoss     = 0
    MaxRecreate       = 0
    MaxCtlLen         = 12

SYMMETRY Symmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    SourceCommittedCovered
    NoDuplicateRows
