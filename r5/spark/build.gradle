plugins {
  id 'java'
}

def icebergVersion = project.findProperty('icebergVersion') ?: '1.12.0'
def sparkLine = project.findProperty('sparkLine') ?: '4.1'
// Unknown spark lines must fail, never fall through to a default.
def sparkVersions = ['4.1': '4.1.1', '3.5': '3.5.6']
if (!sparkVersions.containsKey(sparkLine)) {
  throw new GradleException("unknown sparkLine '${sparkLine}', expected one of ${sparkVersions.keySet()}")
}
def sparkVersion = project.findProperty('sparkVersion') ?: sparkVersions[sparkLine]

repositories {
  mavenCentral()
}

dependencies {
  testImplementation "org.apache.iceberg:iceberg-spark-runtime-${sparkLine}_2.13:${icebergVersion}"
  testImplementation("org.apache.spark:spark-sql_2.13:${sparkVersion}")
  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 17
}

test {
  useJUnitPlatform()
  forkEvery = 1
  systemProperty 'icebergVersion', icebergVersion
  systemProperty 'sparkLine', sparkLine
  systemProperty 'sparkVersion', sparkVersion
  inputs.property('icebergVersion', icebergVersion)
  inputs.property('sparkVersion', sparkVersion)
  ['r5.runs'].each { name ->
    def value = System.getProperty(name)
    if (value != null) systemProperty name, value
    inputs.property(name, value ?: 'unset')
  }
  // Spark on JDK 17/21
  jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
      '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
      '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
      '--add-opens=java.base/java.io=ALL-UNNAMED',
      '--add-opens=java.base/java.net=ALL-UNNAMED',
      '--add-opens=java.base/java.nio=ALL-UNNAMED',
      '--add-opens=java.base/java.util=ALL-UNNAMED',
      '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
      '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
      '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
      '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
      '--add-opens=java.base/sun.nio.cs=ALL-UNNAMED',
      '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
      '--add-opens=java.base/sun.util.calendar=ALL-UNNAMED',
      '-Djdk.reflect.useDirectMethodHandle=false',
      '-Dio.netty.tryReflectionSetAccessible=true'
  maxHeapSize = '3g'
  outputs.upToDateWhen { false }
  testLogging {
    showStandardStreams = false
    events 'failed', 'passed'
    exceptionFormat 'full'
  }
  reports.junitXml {
    includeSystemOutLog = false
    includeSystemErrLog = false
  }
}

tasks.register('printClasspath') {
  doLast { println sourceSets.test.runtimeClasspath.asPath }
}
